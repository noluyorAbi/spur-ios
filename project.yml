name: Spur
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Team and bundle prefix come from Config/Base.xcconfig and the gitignored
# Config/Local.xcconfig. Do not set them here: settings in this file override the xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "18"
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Spur:
    type: application
    platform: iOS
    sources:
      - path: Spur
        excludes:
          - "Info.plist"
      - path: Shared
      # Copied into the all-trips ZIP next to every motion.bin (SPEC 16.3.4).
      - path: docs/MOTION-FORMAT.md
        buildPhase: resources
    dependencies:
      # The Live Activity (SPEC 16): a widget extension, embedded in the app.
      - target: SpurWidgets
    info:
      # Generated by XcodeGen from the properties below; gitignored.
      path: Spur/Info.plist
      properties:
        CFBundleDisplayName: Spur
        NSSupportsLiveActivities: true
        # The Live Activity opens the Fahrt tab through spur://fahrt.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [spur]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Spur zeichnet während einer Fahrt deine genaue Position auf, um die gefahrene Strecke auf der Karte zu zeigen und lokal auf diesem iPhone zu speichern."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Mit „Immer“ kann iOS Spur während einer laufenden Fahrt neu starten, falls das System die App beendet. So geht keine Strecke verloren. Alle Daten bleiben auf diesem iPhone."
        NSLocationTemporaryUsageDescriptionDictionary:
          TripRecording: "Für eine genaue Aufzeichnung der gefahrenen Strecke braucht Spur während der Fahrt die genaue Position."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPUR_BUNDLE_PREFIX).spur
        PRODUCT_NAME: Spur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Spur/Info.plist
  SpurWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SpurWidgets
        excludes:
          - "Info.plist"
      - path: Shared
      # The UI typeface when scripts/install-font.sh copied it in; without it the extension uses
      # the system font (SPEC 16.4).
      - path: Spur/Resources/Fonts
        optional: true
        buildPhase: resources
    info:
      # Generated by XcodeGen; gitignored like the app's.
      path: SpurWidgets/Info.plist
      properties:
        CFBundleDisplayName: Spur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPUR_BUNDLE_PREFIX).spur.widgets
        PRODUCT_NAME: SpurWidgets
        INFOPLIST_FILE: SpurWidgets/Info.plist
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  SpurTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpurTests
    dependencies:
      - target: Spur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPUR_BUNDLE_PREFIX).spur.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Spur.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Spur"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SpurUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SpurUITests
    dependencies:
      - target: Spur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPUR_BUNDLE_PREFIX).spur.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Spur
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  # The real UI flow (Start, hold to stop, history, driven layer, export, ZIP): scripts/ui-flow.sh.
  SpurUIFlow:
    build:
      targets:
        Spur: all
        SpurUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SpurUITests
  Spur:
    build:
      targets:
        Spur: all
        SpurTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SpurTests
    run:
      config: Debug
